name: quality-gates

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Policy checks
        run: node scripts/ci/require-tests-and-docs.mjs

      - name: Repository hygiene
        run: |
          pnpm git:guard:generated
          pnpm git:guard:large-files
          pnpm git:guard:secrets

      - name: Cross-platform verification
        run: |
          pnpm type-check
          pnpm test:unit
          pnpm build
          pnpm perf:bundle
          pnpm perf:build
          pnpm perf:assets
          pnpm perf:memory
          pnpm perf:summary

      - name: Cross-platform performance gate
        run: node scripts/perf/compare-metric.mjs .perf-baselines/bundle.json .perf-results/bundle.json totalBytes 0.08

      - name: Coverage
        run: pnpm test:coverage

      - name: Diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          python -m pip install --upgrade pip diff-cover
          diff-cover coverage/lcov.info --compare-branch=origin/${BASE_REF} --fail-under=90

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/
            coverage/

  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    steps:
      - name: Confirm cross-platform gate completion
        run: echo "quality-gates passed"
