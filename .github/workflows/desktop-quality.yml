name: desktop-quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, master]

concurrency:
  group: desktop-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-desktop:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: bash .codex/scripts/run_verify_commands.sh
      - name: Upload desktop verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthwave-desktop-quality-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .perf-results/**
            dist/**
